config system interface
    edit "port1"
        set vdom "root"
        set ip 172.28.255.200 255.255.255.0
        set allowaccess ping https ssh http
        set type physical
        set alias "MGMT-WSL"
        set snmp-index 1
    next
    edit "port2"
        set vdom "root"
        set ip 100.64.0.2 255.255.255.0
        set allowaccess ping
        set type physical
        set alias "WAN-TO-PA"
        set snmp-index 2
    next
    edit "port3"
        set vdom "root"
        set ip 100.100.0.2 255.255.255.0
        set allowaccess ping
        set type physical
        set alias "WAN2-TO-PA"
        set snmp-index 3
    next
    edit "port4"
        set vdom "root"
        set ip 10.0.0.254 255.255.255.0
        set allowaccess ping https http
        set type physical
        set alias "BRANCH-1_LAN"
        set snmp-index 4
    next
    edit "naf.root"
        set vdom "root"
        set type tunnel
        set src-check disable
        set snmp-index 5
    next
    edit "l2t.root"
        set vdom "root"
        set type tunnel
        set snmp-index 6
    next
    edit "ssl.root"
        set vdom "root"
        set type tunnel
        set alias "SSL VPN interface"
        set snmp-index 7
    next
    edit "fortilink"
        set vdom "root"
        set fortilink enable
        set ip 10.255.1.1 255.255.255.0
        set allowaccess ping fabric
        set type aggregate
        set lldp-reception enable
        set lldp-transmission enable
        set snmp-index 8
    next
    edit "VPN-PA-DC"
        set vdom "root"
        set ip 169.255.1.2 255.255.255.255
        set allowaccess ping https
        set type tunnel
        set remote-ip 169.255.1.1 255.255.255.252
        set snmp-index 9
        set interface "port2"
    next
    edit "VPN2-PA-DC"
        set vdom "root"
        set ip 169.255.1.6 255.255.255.255
        set allowaccess ping https
        set type tunnel
        set remote-ip 169.255.1.5 255.255.255.252
        set snmp-index 10
        set interface "port3"
    next
    edit "LO-MGMT"
        set vdom "root"
        set ip 172.31.255.1 255.255.255.255
        set allowaccess ping https ssh snmp http
        set type loopback
        set snmp-index 11
    next
end

