    }
    IPSEC-FGT-PA {
      esp {
        authentication sha256;
        encryption des;
      }
      dh-group group14;
      lifetime {
        hours 1;
      }
    }
  }
  global-protect-app-crypto-profiles {
    default {
      encryption aes-128-cbc;
      authentication sha1;
    }
  }
}

