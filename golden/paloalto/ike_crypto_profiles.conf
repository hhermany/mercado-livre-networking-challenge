
crypto-profiles {
  ike-crypto-profiles {
    default {
      encryption [ aes-128-cbc 3des];
      hash sha1;
      dh-group group2;
      lifetime {
        hours 8;
      }
    }
    Suite-B-GCM-128 {
      encryption aes-128-cbc;
      hash sha256;
      dh-group group19;
      lifetime {
        hours 8;
      }
    }
    Suite-B-GCM-256 {
      encryption aes-256-cbc;
      hash sha384;
      dh-group group20;
      lifetime {
        hours 8;
      }
    }
    IKE-FGT-PA {
      hash sha256;
      dh-group group14;
      lifetime {
        hours 8;
      }
      encryption des;
    }
  }
  ipsec-crypto-profiles {
    default {
      esp {
        encryption [ aes-128-cbc 3des];
        authentication sha1;
      }
      dh-group group2;
      lifetime {
        hours 1;
      }
    }
    Suite-B-GCM-128 {
      esp {
        encryption aes-128-gcm;
        authentication none;
      }
      dh-group group19;
      lifetime {
        hours 1;
      }
    }
    Suite-B-GCM-256 {
      esp {
        encryption aes-256-gcm;
        authentication none;
      }
      dh-group group20;
      lifetime {
        hours 1;
      }
    }
    IPSEC-FGT-PA {
      esp {
        authentication sha256;
        encryption des;
      }
      dh-group group14;
      lifetime {
        hours 1;
      }
    }
  }
  global-protect-app-crypto-profiles {
    default {
      encryption aes-128-cbc;
      authentication sha1;
    }
  }
}
