config system sdwan
    set status enable
    config zone
        edit "virtual-wan-link"
        next
        edit "VPN-DC"
        next
    end
    config members
        edit 1
            set interface "VPN-PA-DC"
            set zone "VPN-DC"
        next
        edit 2
            set interface "VPN2-PA-DC"
            set zone "VPN-DC"
        next
    end
    config health-check
        edit "Default_DNS"
            set system-dns enable
            set interval 1000
            set probe-timeout 1000
            set recoverytime 10
            config sla
                edit 1
                    set latency-threshold 250
                    set jitter-threshold 50
                    set packetloss-threshold 5
                next
            end
        next
        edit "Default_Office_365"
            set server "www.office.com"
            set protocol http
            set interval 1000
            set probe-timeout 1000
            set recoverytime 10
            config sla
                edit 1
                    set latency-threshold 250
                    set jitter-threshold 50
                    set packetloss-threshold 5
                next
            end
        next
        edit "Default_Gmail"
            set server "gmail.com"
            set interval 1000
            set probe-timeout 1000
            set recoverytime 10
            config sla
                edit 1
                    set latency-threshold 250
                    set jitter-threshold 50
                    set packetloss-threshold 2
                next
            end
        next
        edit "Default_AWS"
            set server "aws.amazon.com"
            set protocol http
            set interval 1000
            set probe-timeout 1000
            set recoverytime 10
            config sla
                edit 1
                    set latency-threshold 250
                    set jitter-threshold 50
                    set packetloss-threshold 5
                next
            end
        next
        edit "Default_Google Search"
            set server "www.google.com"
            set protocol http
            set interval 1000
            set probe-timeout 1000
            set recoverytime 10
            config sla
                edit 1
                    set latency-threshold 250
                    set jitter-threshold 50
                    set packetloss-threshold 5
                next
            end
        next
        edit "Default_FortiGuard"
            set server "fortiguard.com"
            set protocol http
            set interval 1000
            set probe-timeout 1000
            set recoverytime 10
            config sla
                edit 1
                    set latency-threshold 250
                    set jitter-threshold 50
                    set packetloss-threshold 5
                next
            end
        next
        edit "SLA_DC"
            set server "10.255.255.1"
            set interval 1000
            set probe-timeout 250
            set failtime 2
            set recoverytime 10
            set members 1 2
            config sla
                edit 1
                    set latency-threshold 100
                    set jitter-threshold 20
                    set packetloss-threshold 5
                next
            end
        next
    end
    config neighbor
        edit "169.255.1.1"
            set member 1
            set health-check "SLA_DC"
            set sla-id 1
        next
        edit "169.255.1.5"
            set member 2
            set health-check "SLA_DC"
            set sla-id 1
        next
    end
    config service
        edit 1
            set name "TO-DC"
            set mode sla
            set minimum-sla-meet-members 1
            set dst "all"
            set src "all"
            config sla
                edit "SLA_DC"
                    set id 1
                next
            end
            set priority-members 1 2
            set tie-break cfg-order
        next
    end
end

