
======================================================================
show system interface
======================================================================
config system interface
    edit "port1"
        set vdom "root"
        set ip 172.28.255.200 255.255.255.0
        set allowaccess ping https ssh http
        set type physical
        set alias "MGMT-WSL"
        set snmp-index 1
    next
    edit "port2"
        set vdom "root"
        set ip 100.64.0.2 255.255.255.0
        set allowaccess ping
        set type physical
        set alias "WAN-TO-PA"
        set snmp-index 2
    next
    edit "port3"
        set vdom "root"
        set ip 100.100.0.2 255.255.255.0
        set allowaccess ping
        set type physical
        set alias "WAN2-TO-PA"
        set snmp-index 3
    next
    edit "port4"
        set vdom "root"
        set ip 10.0.0.254 255.255.255.0
        set allowaccess ping https http
        set type physical
        set alias "BRANCH-1_LAN"
        set snmp-index 4
    next
    edit "naf.root"
        set vdom "root"
        set type tunnel
        set src-check disable
        set snmp-index 5
    next
    edit "l2t.root"
        set vdom "root"
        set type tunnel
        set snmp-index 6
    next
    edit "ssl.root"
        set vdom "root"
        set type tunnel
        set alias "SSL VPN interface"
        set snmp-index 7
    next
    edit "fortilink"
        set vdom "root"
        set fortilink enable
        set ip 10.255.1.1 255.255.255.0
        set allowaccess ping fabric
        set type aggregate
        set lldp-reception enable
        set lldp-transmission enable
        set snmp-index 8
    next
    edit "VPN-PA-DC"
        set vdom "root"
        set ip 169.255.1.2 255.255.255.255
        set allowaccess ping https
        set type tunnel
        set remote-ip 169.255.1.1 255.255.255.252
        set snmp-index 9
        set interface "port2"
    next
    edit "VPN2-PA-DC"
        set vdom "root"
        set ip 169.255.1.6 255.255.255.255
        set allowaccess ping https
        set type tunnel
        set remote-ip 169.255.1.5 255.255.255.252
        set snmp-index 10
        set interface "port3"
    next
    edit "LO-MGMT"
        set vdom "root"
        set ip 172.31.255.1 255.255.255.255
        set allowaccess ping https ssh snmp http
        set type loopback
        set snmp-index 11
    next
end


======================================================================
show system sdwan
======================================================================
config system sdwan
    set status enable
    config zone
        edit "virtual-wan-link"
        next
        edit "VPN-DC"
        next
    end
    config members
        edit 1
            set interface "VPN-PA-DC"
            set zone "VPN-DC"
        next
        edit 2
            set interface "VPN2-PA-DC"
            set zone "VPN-DC"
        next
    end
    config health-check
        edit "Default_DNS"
            set system-dns enable
            set interval 1000
            set probe-timeout 1000
            set recoverytime 10
            config sla
                edit 1
                    set latency-threshold 250
                    set jitter-threshold 50
                    set packetloss-threshold 5
                next
            end
        next
        edit "Default_Office_365"
            set server "www.office.com"
            set protocol http
            set interval 1000
            set probe-timeout 1000
            set recoverytime 10
            config sla
                edit 1
                    set latency-threshold 250
                    set jitter-threshold 50
                    set packetloss-threshold 5
                next
            end
        next
        edit "Default_Gmail"
            set server "gmail.com"
            set interval 1000
            set probe-timeout 1000
            set recoverytime 10
            config sla
                edit 1
                    set latency-threshold 250
                    set jitter-threshold 50
                    set packetloss-threshold 2
                next
            end
        next
        edit "Default_AWS"
            set server "aws.amazon.com"
            set protocol http
            set interval 1000
            set probe-timeout 1000
            set recoverytime 10
            config sla
                edit 1
                    set latency-threshold 250
                    set jitter-threshold 50
                    set packetloss-threshold 5
                next
            end
        next
        edit "Default_Google Search"
            set server "www.google.com"
            set protocol http
            set interval 1000
            set probe-timeout 1000
            set recoverytime 10
            config sla
                edit 1
                    set latency-threshold 250
                    set jitter-threshold 50
                    set packetloss-threshold 5
                next
            end
        next
        edit "Default_FortiGuard"
            set server "fortiguard.com"
            set protocol http
            set interval 1000
            set probe-timeout 1000
            set recoverytime 10
            config sla
                edit 1
                    set latency-threshold 250
                    set jitter-threshold 50
                    set packetloss-threshold 5
                next
            end
        next
        edit "SLA_DC"
            set server "10.255.255.1"
            set interval 1000
            set probe-timeout 250
            set failtime 2
            set recoverytime 10
            set members 1 2
            config sla
                edit 1
                    set latency-threshold 100
                    set jitter-threshold 20
                    set packetloss-threshold 5
                next
            end
        next
    end
    config neighbor
        edit "169.255.1.1"
            set member 1
            set health-check "SLA_DC"
            set sla-id 1
        next
        edit "169.255.1.5"
            set member 2
            set health-check "SLA_DC"
            set sla-id 1
        next
    end
    config service
        edit 1
            set name "TO-DC"
            set mode sla
            set minimum-sla-meet-members 1
            set dst "all"
            set src "all"
            config sla
                edit "SLA_DC"
                    set id 1
                next
            end
            set priority-members 1 2
            set tie-break cfg-order
        next
    end
end


