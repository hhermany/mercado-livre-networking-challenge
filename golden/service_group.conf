config firewall service group
    edit "Email Access"
        set member "DNS" "IMAP" "IMAPS" "POP3" "POP3S" "SMTP" "SMTPS"
    next
    edit "Web Access"
        set member "DNS" "HTTP" "HTTPS"
    next
    edit "Windows AD"
        set member "DCE-RPC" "DNS" "KERBEROS" "LDAP" "LDAP_UDP" "SAMBA" "SMB"
    next
    edit "Exchange Server"
        set member "DCE-RPC" "DNS" "HTTPS"
    next
    edit "SERVICES-DC"
        set member "PING" "DNS" "HTTP" "HTTPS" "FTP" "NTP" "SSH" "TRACEROUTE"
    next
    edit "SERVICES-MGMT"
        set member "SSH" "RDP" "HTTPS" "HTTP" "SNMP" "TELNET" "TFTP" "TRACEROUTE" "VNC" "PING" "PING6"
    next
end

